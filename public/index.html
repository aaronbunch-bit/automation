<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pGC Coaching Bank</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f5fb;
      --text: #1a1a2e;
      --text-muted: #6b6b80;
      --text-faint: #9a97ad;
      --card-bg: #ffffff;
      --card-border: #f0eef9;
      --pill-border: #ece9f7;
      --metric-box-bg: #fafaff;
      --divider: #f0eef9;
      --shadow: rgba(90,70,160,0.08);
      --status-success: #15803d;
      --status-success-bg: rgba(21,128,61,0.12);
      --status-danger: #b91c1c;
      --status-danger-bg: rgba(185,28,28,0.12);
      --status-warning: #a16207;
      --status-warning-bg: rgba(161,98,7,0.13);
      --status-info: #4f46e5;
      --accent: #7c3aed;
    }
    body.dark {
      color-scheme: dark;
      --bg: #171426;
      --text: #fbfaff;
      --text-muted: #d4cfe5;
      --text-faint: #b4aecb;
      --card-bg: #242039;
      --card-border: #403959;
      --pill-border: #4a4265;
      --metric-box-bg: #1e1b30;
      --divider: #403959;
      --shadow: rgba(0,0,0,0.45);
      --status-success: #4ade80;
      --status-success-bg: rgba(74,222,128,0.16);
      --status-danger: #f87171;
      --status-danger-bg: rgba(248,113,113,0.16);
      --status-warning: #fbbf24;
      --status-warning-bg: rgba(251,191,36,0.16);
      --status-info: #a5b4fc;
      --accent: #c4b5fd;
    }
    * { box-sizing: border-box; }
    html { overflow-x: clip; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px;
      transition: background 0.25s ease, color 0.25s ease;
      overflow-x: clip;
      min-height: 100vh;
    }
    .card, .theme-btn, .pill, .stat, .status-pill, th, details.sg-parent, details.sg, .metric-box {
      transition: background-color 0.25s ease, background 0.25s ease,
        border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }
    .wrap { max-width: 1140px; margin: 0 auto; padding: 0 20px; position: relative; }

    .top-bar {
      display: flex; justify-content: flex-end; align-items: center;
      margin: 0 0 2px; min-height: 34px; gap: 10px;
    }
    .theme-btn {
      background: var(--card-bg); color: var(--text);
      border: 1px solid var(--pill-border); border-radius: 999px;
      padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
      box-shadow: 0 1px 2px var(--shadow); white-space: nowrap;
    }
    .theme-btn:hover { opacity: 0.85; }

    .title-row { position: relative; text-align: center; margin: 6px 0 6px; }
    .header-aura {
      position: absolute; top: 50%; left: 50%; z-index: -1;
      width: 100vw; width: 100dvw; max-width: none;
      margin-left: -50vw; margin-left: -50dvw;
      height: 260px;
      background: linear-gradient(90deg,
        rgba(56,189,248,0.26), rgba(99,102,241,0.3), rgba(168,85,247,0.32),
        rgba(244,114,182,0.32), rgba(56,189,248,0.26), rgba(99,102,241,0.3),
        rgba(168,85,247,0.32));
      background-size: 300% 100%;
      filter: blur(55px);
      pointer-events: none;
      transform: translateY(-50%);
      animation: auraSweep 18s linear infinite, auraBob 7s ease-in-out infinite;
    }
    @keyframes auraSweep { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    @keyframes auraBob {
      0%, 100% { transform: translateY(-50%) scaleY(1); }
      50% { transform: translateY(-46%) scaleY(1.15); }
    }
    @media (max-width: 700px) { .header-aura { display: none; } }
    @media (prefers-reduced-motion: reduce) { .header-aura { animation: none; } }

    h1 { font-size: 30px; margin: 0 0 4px; font-weight: 800; letter-spacing: -0.02em; }
    .grad-text {
      background: linear-gradient(90deg, #f472b6, #a855f7 45%, #6366f1 75%, #38bdf8);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tag {
      margin: 0 auto; color: var(--text-muted); max-width: 44rem;
      line-height: 1.5; font-size: 14px; font-weight: 500;
    }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
      justify-content: center; margin: 22px 0 20px;
    }
    label {
      display: flex; flex-direction: column; gap: 0.35rem;
      font-size: 11px; font-weight: 700; color: var(--text-faint);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    input, select {
      font: inherit; font-size: 14px; font-weight: 500;
      border: 1px solid var(--pill-border); border-radius: 999px;
      padding: 9px 16px; background: var(--card-bg); color: var(--text);
      box-shadow: 0 1px 2px var(--shadow);
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.action {
      font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      border-radius: 999px; padding: 10px 22px;
      border: 1px solid var(--pill-border); background: var(--card-bg);
      color: var(--text); box-shadow: 0 1px 2px var(--shadow); align-self: end;
    }
    button.action:hover { filter: brightness(1.03); transform: translateY(-1px); }
    button.action.primary {
      background: linear-gradient(105deg, #0ea5e9 0%, #6366f1 55%, #a855f7 100%);
      color: #fff; border: none; box-shadow: 0 3px 14px rgba(99,102,241,0.35);
    }
    button.action:disabled { opacity: 0.55; cursor: wait; transform: none; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px; margin-bottom: 18px;
    }
    .stat {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 18px; padding: 16px 18px; box-shadow: 0 2px 14px var(--shadow);
    }
    .stat .k {
      font-size: 11px; color: var(--text-faint); text-transform: uppercase;
      letter-spacing: 0.05em; font-weight: 700;
    }
    .stat .v { font-size: 1.8rem; margin-top: 0.25rem; font-weight: 800; letter-spacing: -0.02em; }

    .meta {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card-bg); border: 1px solid var(--pill-border);
      border-radius: 999px; padding: 7px 16px; font-size: 12.5px;
      color: var(--text-muted); box-shadow: 0 1px 2px var(--shadow);
      margin-bottom: 18px; font-weight: 600;
    }
    .meta b { color: var(--text); font-weight: 800; }
    .error {
      background: var(--status-danger-bg); color: var(--status-danger);
      padding: 0.85rem 1.1rem; border-radius: 14px; margin-bottom: 16px;
      font-weight: 600; border: 1px solid var(--status-danger);
    }

    /* --- Consumer Sales → supergroup → reps accordion --- */
    summary { cursor: pointer; list-style: none; outline: none; }
    summary::-webkit-details-marker { display: none; }
    .caret {
      display: inline-block; flex: none; width: 18px; text-align: center;
      color: var(--text-faint); font-size: 12px; transition: transform 0.2s ease;
    }
    details[open] > summary > .caret { transform: rotate(90deg); }

    details.sg-parent {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 18px; box-shadow: 0 2px 14px var(--shadow);
      padding: 6px 8px 10px; margin-bottom: 14px;
    }
    .sg-parent > summary {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 12px; border-radius: 14px;
    }
    .sg-parent > summary:hover { background: var(--metric-box-bg); }
    .sg-parent-title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
    .spacer { flex: 1 1 auto; }

    details.sg {
      background: var(--metric-box-bg); border: 1px solid var(--card-border);
      border-radius: 14px; margin: 8px 6px; overflow: hidden;
    }
    .sg > summary {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 14px 16px;
    }
    .sg > summary:hover { background: color-mix(in srgb, var(--metric-box-bg) 60%, var(--card-border)); }
    .sg-name { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }

    .sg-body { padding: 4px 16px 16px; }
    .metric-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px; margin: 6px 0 14px;
    }
    .metric-box {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 12px 14px;
    }
    .metric-box .k {
      font-size: 10.5px; color: var(--text-faint); text-transform: uppercase;
      letter-spacing: 0.06em; font-weight: 800;
    }
    .metric-box .v { font-size: 1.5rem; font-weight: 800; margin-top: 3px; letter-spacing: -0.02em; }

    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: var(--card-bg); border: 1px solid var(--pill-border);
      color: var(--text-muted); box-shadow: 0 1px 2px var(--shadow);
    }
    .chip b { color: var(--text); font-weight: 800; }
    .chip.up { color: var(--status-success); border-color: var(--status-success); background: var(--status-success-bg); }
    .chip.down { color: var(--status-danger); border-color: var(--status-danger); background: var(--status-danger-bg); }
    .chip.flat { color: var(--status-warning); border-color: var(--status-warning); background: var(--status-warning-bg); }

    details.reps {
      border-top: 1px dashed var(--card-border); padding-top: 6px;
    }
    .reps > summary {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 700; color: var(--accent);
      padding: 8px 4px;
    }
    .reps-table-wrap {
      overflow: auto; border: 1px solid var(--card-border);
      border-radius: 12px; margin-top: 6px; background: var(--card-bg);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td {
      text-align: left; padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--divider); white-space: nowrap;
    }
    th {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-faint); font-weight: 800; background: var(--metric-box-bg);
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: var(--metric-box-bg); }
    td b { font-weight: 700; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    }
    .status-pill.effective { background: var(--status-success-bg); color: var(--status-success); }
    .status-pill.poor { background: var(--status-danger-bg); color: var(--status-danger); }
    .status-pill.pending,
    .status-pill.insufficient_data { background: var(--status-warning-bg); color: var(--status-warning); }
    .delta.up { color: var(--status-success); font-weight: 700; }
    .delta.down { color: var(--status-danger); font-weight: 700; }
    .empty { padding: 18px; color: var(--text-muted); text-align: center; }

    @media (prefers-reduced-motion: no-preference) {
      .stat, details.sg-parent { animation: rise 0.45s ease both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <button id="themeBtn" class="theme-btn" type="button">🌙 Dark</button>
    </div>

    <div class="title-row">
      <div class="header-aura" aria-hidden="true"></div>
      <h1><span class="grad-text">pGC Coaching Bank</span></h1>
      <p class="tag">
        Consumer Sales coaching effectivity from Looker pGC:
        L7 (7 days before) → N7 (7 days after). An increase means effective coaching.
      </p>
    </div>

    <div class="toolbar">
      <label>Coach
        <input id="coachFilter" placeholder="Filter coach" />
      </label>
      <label>Verdict
        <select id="verdictFilter">
          <option value="">All</option>
          <option value="effective">Effective</option>
          <option value="poor">Poor / neutral</option>
          <option value="pending">Pending N7</option>
          <option value="insufficient_data">Insufficient data</option>
        </select>
      </label>
      <button id="refreshBtn" class="action" type="button">Refresh</button>
      <button id="syncBtn" class="action primary" type="button">Run sync</button>
    </div>

    <p class="meta" id="meta">Loading…</p>
    <div id="error" class="error" hidden></div>

    <div class="stats" id="stats"></div>

    <div id="hierarchy"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // --- Theme toggle (light/dark) ---
    function applyTheme(theme) {
      const dark = theme === 'dark';
      document.body.classList.toggle('dark', dark);
      $('themeBtn').textContent = dark ? '☀️ Light' : '🌙 Dark';
    }
    (function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('pgc-theme'); } catch {}
      if (!saved) {
        saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      applyTheme(saved);
    })();
    $('themeBtn').addEventListener('click', () => {
      const next = document.body.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('pgc-theme', next); } catch {}
    });

    // --- Formatting helpers ---
    function fmt(n, digits = 3) {
      if (n == null || Number.isNaN(n)) return '—';
      return Number(n).toFixed(digits);
    }
    function pct(n) {
      if (n == null) return '—';
      return (n * 100).toFixed(0) + '%';
    }
    function mean(nums) {
      const arr = nums.filter((n) => typeof n === 'number' && Number.isFinite(n));
      if (!arr.length) return null;
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function deltaClass(n) {
      if (n == null || Number.isNaN(n)) return 'flat';
      return n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
    }
    function deltaText(n) {
      if (n == null || Number.isNaN(n)) return '—';
      const sign = n > 0 ? '+' : '';
      return sign + Number(n).toFixed(3);
    }
    function pill(verdict) {
      return `<span class="status-pill ${esc(verdict)}">${esc(verdict)}</span>`;
    }

    // --- Build the Consumer Sales → supergroup hierarchy from sessions ---
    function groupBySupergroup(sessions) {
      const map = new Map();
      for (const s of sessions) {
        const key = s.supergroup || '(Unassigned)';
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(s);
      }
      return [...map.entries()]
        .map(([supergroup, reps]) => {
          const l7 = mean(reps.map((r) => r.l7));
          const n7 = mean(reps.map((r) => r.n7));
          const delta = l7 == null || n7 == null ? null : n7 - l7;
          const effective = reps.filter((r) => r.verdict === 'effective').length;
          const poor = reps.filter((r) => r.verdict === 'poor').length;
          const pending = reps.filter((r) => r.verdict === 'pending').length;
          const scored = effective + poor;
          return {
            supergroup, reps, l7, n7, delta, effective, poor, pending,
            effectivityRate: scored ? effective / scored : null,
          };
        })
        .sort((a, b) => a.supergroup.localeCompare(b.supergroup));
    }

    function metricBoxes(l7, n7, delta) {
      return `
        <div class="metric-row">
          <div class="metric-box"><div class="k">Overall pGC L7</div><div class="v">${fmt(l7)}</div></div>
          <div class="metric-box"><div class="k">Overall pGC N7</div><div class="v">${fmt(n7)}</div></div>
          <div class="metric-box"><div class="k">Δ pGC (N7 − L7)</div><div class="v delta ${deltaClass(delta)}">${deltaText(delta)}</div></div>
        </div>`;
    }

    function repsTable(reps) {
      const rows = reps
        .slice()
        .sort((a, b) => (a.coachee || '').localeCompare(b.coachee || ''))
        .map((s) => `
          <tr>
            <td><b>${esc(s.coachee || s.coacheeEmail)}</b></td>
            <td>${esc(s.coach || '—')}</td>
            <td>${esc(s.coachingDate)}</td>
            <td>${fmt(s.l7)}</td>
            <td>${fmt(s.n7)}</td>
            <td><span class="delta ${deltaClass(s.delta)}">${deltaText(s.delta)}</span></td>
            <td>${pill(s.verdict)}</td>
          </tr>`).join('');
      return `
        <div class="reps-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Rep</th><th>Coach</th><th>Coaching date</th>
                <th>L7</th><th>N7</th><th>Delta</th><th>Verdict</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function supergroupSection(g) {
      const dc = deltaClass(g.delta);
      return `
        <details class="sg">
          <summary>
            <span class="caret">▶</span>
            <span class="sg-name">${esc(g.supergroup)}</span>
            <span class="spacer"></span>
            <span class="chip ${dc}">Δ <b>${deltaText(g.delta)}</b></span>
            <span class="chip">Effectivity <b>${pct(g.effectivityRate)}</b></span>
            <span class="chip">${g.reps.length} rep${g.reps.length === 1 ? '' : 's'}</span>
          </summary>
          <div class="sg-body">
            ${metricBoxes(g.l7, g.n7, g.delta)}
            <details class="reps">
              <summary>▸ Drill into reps (${g.reps.length})</summary>
              ${repsTable(g.reps)}
            </details>
          </div>
        </details>`;
    }

    function render(data) {
      const sessions = data.sessions || [];
      const groups = groupBySupergroup(sessions);

      const scored = sessions.filter((s) => s.verdict === 'effective' || s.verdict === 'poor');
      const effective = scored.filter((s) => s.verdict === 'effective').length;
      const pending = sessions.filter((s) => s.verdict === 'pending').length;
      const overallL7 = mean(sessions.map((s) => s.l7));
      const overallN7 = mean(sessions.map((s) => s.n7));
      const overallDelta = overallL7 == null || overallN7 == null ? null : overallN7 - overallL7;

      $('meta').innerHTML =
        `Last sync: <b>${esc(data.lastSync || 'never')}</b> · Mode: <b>${esc(data.mode || '—')}</b> · As of: <b>${esc(data.asOf || '—')}</b>`;

      $('stats').innerHTML = `
        <div class="stat"><div class="k">Reps</div><div class="v">${sessions.length}</div></div>
        <div class="stat"><div class="k">Effective</div><div class="v">${effective}</div></div>
        <div class="stat"><div class="k">Pending N7</div><div class="v">${pending}</div></div>
        <div class="stat"><div class="k">Effectivity</div><div class="v">${pct(scored.length ? effective / scored.length : null)}</div></div>
      `;

      if (!sessions.length) {
        $('hierarchy').innerHTML = `<div class="card" style="padding:6px 4px"><div class="empty">No sessions in the bank yet — run sync.</div></div>`;
        return;
      }

      const dc = deltaClass(overallDelta);
      $('hierarchy').innerHTML = `
        <details class="sg-parent" open>
          <summary>
            <span class="caret">▶</span>
            <span class="sg-parent-title">Consumer Sales</span>
            <span class="spacer"></span>
            <span class="chip">L7 <b>${fmt(overallL7)}</b></span>
            <span class="chip">N7 <b>${fmt(overallN7)}</b></span>
            <span class="chip ${dc}">Δ <b>${deltaText(overallDelta)}</b></span>
            <span class="chip">${groups.length} supergroup${groups.length === 1 ? '' : 's'}</span>
          </summary>
          <div style="padding-top:4px">
            ${groups.map(supergroupSection).join('')}
          </div>
        </details>`;
    }

    async function loadResults() {
      $('error').hidden = true;
      const coach = $('coachFilter').value.trim();
      const verdict = $('verdictFilter').value;
      const params = new URLSearchParams();
      if (coach) params.set('coach', coach);
      if (verdict) params.set('verdict', verdict);
      const res = await fetch('/api/results?' + params.toString());
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load results');
      render(data);
    }

    async function runSync() {
      $('syncBtn').disabled = true;
      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sync failed');
        await loadResults();
      } catch (err) {
        $('error').hidden = false;
        $('error').textContent = err.message;
      } finally {
        $('syncBtn').disabled = false;
      }
    }

    $('refreshBtn').addEventListener('click', () => {
      loadResults().catch((err) => {
        $('error').hidden = false;
        $('error').textContent = err.message;
      });
    });
    $('syncBtn').addEventListener('click', runSync);
    $('coachFilter').addEventListener('change', () => loadResults().catch(console.error));
    $('verdictFilter').addEventListener('change', () => loadResults().catch(console.error));

    loadResults().catch(async () => {
      // Auto-seed demo bank on first visit if empty/missing
      try {
        await runSync();
      } catch (err) {
        $('error').hidden = false;
        $('error').textContent = err.message;
      }
    });
  </script>
</body>
</html>
